syntax = "proto3";

package session.v1;

option go_package = "github.com/vitormartins1/go-game-backend/services/session-service/gen/session/v1;sessionv1";

// Session orquestra frota/sessão (≈ GameLift). A partir de um match, aloca um
// game server, emite um connect token Ed25519 por jogador e recebe o resultado
// da partida. Control plane interno (ADR-0010); unary no MVP (ADR-0003).
service Session {
  // CreateSession aloca um game server livre, emite um connect token por
  // jogador e registra a sessão. ResourceExhausted se o pool esgotar.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // ReportResult dispara o fan-out do resultado, libera o server e encerra a
  // sessão. NotFound se não houver sessão para o match.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
}

message CreateSessionRequest {
  string match_id = 1;
  repeated string players = 2; // playerIDs do match
  string game_id = 3;          // jogo da partida (multi-tenant, ADR-0017)
}

message CreateSessionResponse {
  string session_id = 1;
  string server_address = 2;       // endereço do game server alocado
  repeated ConnectGrant grants = 3; // um connect token por jogador
}

// ConnectGrant é o connect token (JWT EdDSA) de um jogador para o game server.
message ConnectGrant {
  string player_id = 1;
  string connect_token = 2;
}

message ReportResultRequest {
  string match_id = 1;
  // outcome polimórfico por arquétipo (ADR-0023). O kind é implícito no campo
  // setado; novos arquétipos entram como novos campos do oneof.
  oneof outcome {
    WinLossDrawResult win_loss_draw = 2; // arquétipo queue_arena
  }
}

message ReportResultResponse {}

// WinLossDrawResult é o outcome do arquétipo queue_arena: vitória/derrota/empate
// por jogador (e por time, via team_id), com stats.
message WinLossDrawResult {
  repeated PlayerOutcome players = 1;
}

// PlayerOutcome é o resultado de um jogador na partida (reportado pelo server).
message PlayerOutcome {
  string player_id = 1;
  string team_id = 2;             // vazio em FFA
  string outcome = 3;             // "win" | "loss" | "draw"
  int64 score = 4;
  map<string, int64> stats = 5;   // métricas declaradas (kills, assists, ...)
}
