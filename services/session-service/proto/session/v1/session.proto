syntax = "proto3";

package session.v1;

option go_package = "github.com/vitormartins1/go-game-backend/services/session-service/gen/session/v1;sessionv1";

// Session orquestra frota/sessão (≈ GameLift). A partir de um match, aloca um
// game server, emite um connect token Ed25519 por jogador e recebe o resultado
// da partida. Control plane interno (ADR-0010); unary no MVP (ADR-0003).
service Session {
  // CreateSession aloca um game server livre, emite um connect token por
  // jogador e registra a sessão. ResourceExhausted se o pool esgotar.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // ReportResult dispara o fan-out do resultado, libera o server e encerra a
  // sessão. NotFound se não houver sessão para o match.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);

  // Arquétipo host_world_dropin (ADR-0023, spec 011): mundo persistente de um
  // host com phantoms co-op/invasor por slot de papel.

  // OpenWorld abre um mundo persistente para o host: aloca um server, deriva os
  // slots por papel do perfil e emite o connect token do host. FailedPrecondition
  // se o jogo não for host_world_dropin; ResourceExhausted se o pool esgotar.
  rpc OpenWorld(OpenWorldRequest) returns (OpenWorldResponse);
  // JoinWorld injeta um phantom no mundo com um papel (coop/invader), ocupando um
  // slot, e emite o connect token com o claim role. InvalidArgument (papel não
  // habilitado), ResourceExhausted (slots cheios), NotFound (mundo inexistente),
  // FailedPrecondition (já presente).
  rpc JoinWorld(JoinWorldRequest) returns (JoinWorldResponse);
  // LeaveWorld libera o slot do jogador; o mundo segue aberto. No-op idempotente
  // se ausente. Se o jogador for o host, encerra o mundo.
  rpc LeaveWorld(LeaveWorldRequest) returns (LeaveWorldResponse);
  // CloseWorld encerra o mundo (host saiu), libera o server. NotFound se não
  // houver mundo aberto.
  rpc CloseWorld(CloseWorldRequest) returns (CloseWorldResponse);

  // ListInvadableWorlds devolve os mundos abertos do jogo com slot de invasor
  // livre + atributos do host (spec 012). Fonte de dados pura para o matchmaking
  // (006) descobrir alvos; sem filtro de faixa/senha. Lista vazia se nada casar.
  rpc ListInvadableWorlds(ListInvadableWorldsRequest) returns (ListInvadableWorldsResponse);
}

// host_world_dropin (spec 011): o connect token carrega o claim role
// (host|coop|invader), lido pelo game server no connection approval.
message OpenWorldRequest {
  string host_player_id = 1;  // dono do mundo
  string game_id = 2;         // jogo (multi-tenant, ADR-0017); perfil host_world_dropin
  int32 host_soul_level = 3;  // faixa do host p/ matchmaking (spec 012); 0 = sem faixa
  int32 weapon_tier = 4;      // tier de arma do host (spec 012); 0 = sem faixa
}

message OpenWorldResponse {
  string session_id = 1;       // identidade do mundo (não há match)
  string server_address = 2;   // endereço do game server alocado
  ConnectGrant host_grant = 3; // connect token do host (claim role=host)
}

message JoinWorldRequest {
  string session_id = 1;
  string player_id = 2;
  string role = 3; // "coop" | "invader"
}

message JoinWorldResponse {
  ConnectGrant grant = 1;    // connect token do phantom (claim role)
  string server_address = 2; // endereço do game server do mundo (spec 012): o phantom precisa dele p/ conectar
}

message LeaveWorldRequest {
  string session_id = 1;
  string player_id = 2;
}

message LeaveWorldResponse {}

message CloseWorldRequest {
  string session_id = 1;
}

message CloseWorldResponse {}

// spec 012 — diretório de mundos invadíveis. O matchmaking (006) consulta por
// jogo; a política de faixa é aplicada lá, não aqui.
message ListInvadableWorldsRequest {
  string game_id = 1; // jogo (multi-tenant, ADR-0017)
}

message ListInvadableWorldsResponse {
  repeated InvadableWorld worlds = 1; // vazio se nenhum mundo tem vaga de invasor
}

// InvadableWorld é a fotografia de um mundo aberto com vaga de invasor: os
// atributos do host (para o matchmaking casar por faixa) e as vagas livres.
message InvadableWorld {
  string session_id = 1;
  int32 host_soul_level = 2;
  int32 weapon_tier = 3;
  int32 free_invader_slots = 4;
}

message CreateSessionRequest {
  string match_id = 1;
  repeated string players = 2; // playerIDs do match (lista completa; fonte p/ tokens)
  string game_id = 3;          // jogo da partida (multi-tenant, ADR-0017)
  repeated Team teams = 4;     // composição de times (ADR-0023 queue_arena); vazio em FFA
}

// Team é um lado da partida NvN: um rótulo estável no match + seus jogadores
// (ADR-0023). Em FFA não há times (teams vazio). O session é o dono canônico
// da composição — carimba o team_id no resultado a partir daqui e emite o
// connect token de cada jogador com o claim team_id.
message Team {
  string team_id = 1;          // rótulo estável no match (ex.: "team-1")
  repeated string players = 2; // playerIDs deste time
}

message CreateSessionResponse {
  string session_id = 1;
  string server_address = 2;       // endereço do game server alocado
  repeated ConnectGrant grants = 3; // um connect token por jogador
}

// ConnectGrant é o connect token (JWT EdDSA) de um jogador para o game server.
message ConnectGrant {
  string player_id = 1;
  string connect_token = 2;
}

message ReportResultRequest {
  string match_id = 1;
  // outcome polimórfico por arquétipo (ADR-0023). O kind é implícito no campo
  // setado; novos arquétipos entram como novos campos do oneof.
  oneof outcome {
    WinLossDrawResult win_loss_draw = 2; // arquétipo queue_arena
  }
}

message ReportResultResponse {}

// WinLossDrawResult é o outcome do arquétipo queue_arena: vitória/derrota/empate
// por jogador (e por time, via team_id), com stats.
message WinLossDrawResult {
  repeated PlayerOutcome players = 1;
}

// PlayerOutcome é o resultado de um jogador na partida (reportado pelo server).
message PlayerOutcome {
  string player_id = 1;
  string team_id = 2;             // vazio em FFA
  string outcome = 3;             // "win" | "loss" | "draw"
  int64 score = 4;
  map<string, int64> stats = 5;   // métricas declaradas (kills, assists, ...)
}
