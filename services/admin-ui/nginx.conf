server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API do admin-bff (mesma origem -> sem CORS). admin-bff escuta :8080
    # dentro da rede do compose. Mantém o path: /api/topology -> admin-bff/api/topology.
    location /api/ {
        proxy_pass http://admin-bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: rotas do client caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
