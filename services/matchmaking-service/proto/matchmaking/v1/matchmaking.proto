syntax = "proto3";

package matchmaking.v1;

option go_package = "github.com/c130n/game-backend/services/matchmaking-service/gen/matchmaking/v1;matchmakingv1";

// Matchmaking forma partidas a partir de uma fila de tickets (≈ GameLift
// FlexMatch). Ver ADR-0003 (gRPC com streaming).
service Matchmaking {
  // FindMatch enfileira o jogador e transmite o status do ticket até o match
  // (server-streaming). Cancelar a chamada remove o ticket da fila.
  rpc FindMatch(FindMatchRequest) returns (stream TicketUpdate);
}

message FindMatchRequest {
  string game_id = 1; // o jogo do cliente (multi-tenant, ADR-0017)
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_SEARCHING = 1;
  STATUS_MATCHED = 2;
  STATUS_FAILED = 3; // provisionamento da sessão falhou (ver reason)
}

message TicketUpdate {
  Status status = 1;
  string match_id = 2;          // preenchido em MATCHED/FAILED
  repeated string players = 3;  // playerIDs do match
  string server_address = 4;    // endereço do game server alocado (MATCHED)
  string connect_token = 5;     // connect token EdDSA do próprio jogador (MATCHED)
  string reason = 6;            // motivo quando FAILED
}
