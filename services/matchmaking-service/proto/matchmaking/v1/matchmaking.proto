syntax = "proto3";

package matchmaking.v1;

option go_package = "github.com/vitormartins1/go-multiplayer-control-plane/services/matchmaking-service/gen/matchmaking/v1;matchmakingv1";

// Matchmaking forma partidas a partir de uma fila de tickets (≈ GameLift
// FlexMatch). Ver ADR-0003 (gRPC com streaming).
service Matchmaking {
  // FindMatch enfileira o jogador e transmite o status do ticket até o match
  // (server-streaming). Cancelar a chamada remove o ticket da fila.
  rpc FindMatch(FindMatchRequest) returns (stream TicketUpdate);

  // Invade é o segundo modo (host_world_dropin, spec 006): o invasor descobre um
  // mundo aberto elegível e é injetado nele (unary — resolve na hora ou falha).
  // FailedPrecondition (jogo não aceita invasão), NotFound (nenhum mundo na
  // faixa). O playerID do invasor vem do JWT, não do request.
  rpc Invade(InvadeRequest) returns (InvadeResponse);

  // Co-op por quadro de sinais (host_world_dropin, spec 007) — dois passos:
  // PostSummonSign é o aliado anunciando e AGUARDANDO ser invocado (server-
  // streaming: POSTED → SUMMONED com server+token, ou EXPIRED no TTL). Fechar o
  // stream cancela o sinal. FailedPrecondition se o jogo não aceita co-op.
  rpc PostSummonSign(PostSummonSignRequest) returns (stream SummonUpdate);
  // ListSigns: o host vê os sinais compatíveis com o mundo dele (faixa de co-op).
  rpc ListSigns(ListSignsRequest) returns (ListSignsResponse);
  // SummonSign: o host escolhe um sinal; o aliado é injetado como coop e recebe
  // server+token pelo stream do PostSummonSign. NotFound (sinal inexistente),
  // FailedPrecondition (já consumido), ResourceExhausted (sem vaga de co-op).
  rpc SummonSign(SummonSignRequest) returns (SummonSignResponse);
}

message FindMatchRequest {
  string game_id = 1; // o jogo do cliente (multi-tenant, ADR-0017)
  string mode_id = 2; // modo do jogo (ADR-0024, spec 010); vazio = "default"
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_SEARCHING = 1;
  STATUS_MATCHED = 2;
  STATUS_FAILED = 3; // provisionamento da sessão falhou (ver reason)
}

message TicketUpdate {
  Status status = 1;
  string match_id = 2;          // preenchido em MATCHED/FAILED
  repeated string players = 3;  // playerIDs do match
  string server_address = 4;    // endereço do game server alocado (MATCHED)
  string connect_token = 5;     // connect token EdDSA do próprio jogador (MATCHED)
  string reason = 6;            // motivo quando FAILED
}

// host_world_dropin (spec 006): a invasão traz a faixa do invasor; o mundo é
// descoberto e a injeção resolve na hora. O playerID vem do JWT (interceptor).
message InvadeRequest {
  string game_id = 1;      // jogo (multi-tenant, ADR-0017); perfil host_world_dropin
  int32 soul_level = 2;    // nível do invasor (faixa assimétrica); 0 = sem faixa
  int32 weapon_tier = 3;   // tier de arma do invasor (se o perfil exigir)
  string mode_id = 4;      // modo do jogo (ADR-0024); vazio = "default"
}

message InvadeResponse {
  string session_id = 1;     // mundo em que o invasor entrou
  string server_address = 2; // endereço do game server do mundo
  string connect_token = 3;  // connect token EdDSA do invasor (claim role=invader)
}

// Co-op por quadro de sinais (spec 007). O aliado anuncia com a sua faixa; o
// playerID vem do JWT (interceptor), não do request.
message PostSummonSignRequest {
  string game_id = 1;    // jogo (multi-tenant, ADR-0017); perfil host_world_dropin
  int32 soul_level = 2;  // nível do aliado (faixa simétrica de co-op)
  int32 weapon_tier = 3; // tier de arma do aliado (se o perfil exigir)
  string mode_id = 4;    // modo do jogo (ADR-0024); o sinal só aparece p/ hosts do mesmo modo
}

// SummonStatus é o ciclo do sinal no stream do aliado (spec 007).
enum SummonStatus {
  SUMMON_STATUS_UNSPECIFIED = 0;
  SUMMON_STATUS_POSTED = 1;    // publicado; aguardando invocação (traz sign_id)
  SUMMON_STATUS_SUMMONED = 2;  // invocado por um host (traz server + token)
  SUMMON_STATUS_EXPIRED = 3;   // TTL venceu / cancelado sem invocação
}

message SummonUpdate {
  SummonStatus status = 1;
  string sign_id = 2;        // preenchido em POSTED
  string session_id = 3;     // mundo do host (SUMMONED)
  string server_address = 4; // endereço do game server (SUMMONED)
  string connect_token = 5;  // connect token EdDSA do aliado, claim role=coop (SUMMONED)
}

message ListSignsRequest {
  string game_id = 1;          // jogo (multi-tenant)
  int32 host_soul_level = 2;   // faixa do mundo do host (filtra os sinais compatíveis)
  int32 host_weapon_tier = 3;
  string mode_id = 4;          // modo do mundo do host (ADR-0024); vazio = "default"
}

message ListSignsResponse {
  repeated SummonSign signs = 1; // vazio se nenhum sinal compatível
}

// SummonSign é um sinal ativo no quadro, do ponto de vista do host que navega.
message SummonSign {
  string sign_id = 1;
  string player_id = 2; // o aliado que anunciou
  int32 soul_level = 3;
  int32 weapon_tier = 4;
}

message SummonSignRequest {
  string session_id = 1; // mundo do host onde injetar o aliado
  string sign_id = 2;    // o sinal escolhido
}

message SummonSignResponse {
  string player_id = 1; // o aliado invocado (o server/token vão pelo stream dele)
}
