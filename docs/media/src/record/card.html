<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Cartela — vídeos de feature</title>
<!--
  Cartela de abertura/fechamento dos vídeos de feature, no estilo do filme
  (../film.html). Parâmetros na query: kicker, title, sub, foot, dur (segundos).
  Como o filme, a imagem é função pura do tempo: window.__seek(t).
-->
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(../fonts/space-grotesk-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url(../fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(../fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url(../fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
:root { --bg: #0a0d12; --muted: #7d8a99; --text: #e6edf3; --text2: #c8d3de; --signal: #5eb8ff; --nominal: #4ade9a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; color: var(--text); -webkit-font-smoothing: antialiased; }
#grid { position: absolute; inset: -80px; background-image:
  linear-gradient(rgba(94,184,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(94,184,255,0.06) 1px, transparent 1px);
  background-size: 64px 64px; }
.glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: 0.35; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.65) 100%); }
#brand { position: absolute; left: 96px; top: 72px; display: flex; gap: 16px; align-items: center; font: 500 20px "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
#brand svg { width: 40px; height: 40px; }
#box { position: absolute; left: 160px; right: 160px; top: 380px; }
#kicker { font: 500 24px "IBM Plex Mono", monospace; color: var(--signal); letter-spacing: 0.16em; text-transform: uppercase; display: flex; gap: 14px; align-items: center; }
#kicker i { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 16px var(--signal); }
#title { font: 700 104px/1.05 "Space Grotesk", sans-serif; letter-spacing: -0.02em; margin-top: 28px; }
#sub { font: 400 36px/1.4 "IBM Plex Sans", sans-serif; color: var(--text2); margin-top: 28px; max-width: 1400px; }
#foot { position: absolute; left: 96px; bottom: 72px; font: 400 22px "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: 0.06em; }
#bar { position: absolute; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--signal), var(--nominal)); }
</style>
</head>
<body>
<div id="grid"></div>
<div class="glow" id="g1" style="background:#1d4f86"></div>
<div class="glow" id="g2" style="background:#155e45"></div>
<div id="vignette"></div>
<div id="brand">
  <svg viewBox="0 0 132 132" fill="none">
    <path d="M66 6 L118 36 L118 96 L66 126 L14 96 L14 36 Z" stroke="#5eb8ff" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="66" cy="66" r="14" fill="#4ade9a"/>
    <g stroke="#5eb8ff" stroke-width="5" stroke-linecap="round"><line x1="66" y1="52" x2="66" y2="26"/><line x1="78" y1="73" x2="100" y2="86"/><line x1="54" y1="73" x2="32" y2="86"/></g>
    <circle cx="66" cy="24" r="7" fill="#5eb8ff"/><circle cx="102" cy="87" r="7" fill="#5eb8ff"/><circle cx="30" cy="87" r="7" fill="#5eb8ff"/>
  </svg>
  Go Multiplayer Control Plane
</div>
<div id="box">
  <div id="kicker"><i></i><span></span></div>
  <div id="title"></div>
  <div id="sub"></div>
</div>
<div id="foot"></div>
<div id="bar"></div>
<script>
const q = new URLSearchParams(location.search);
const DUR = Number(q.get("dur") || 4);
document.querySelector("#kicker span").textContent = q.get("kicker") || "";
document.getElementById("title").innerHTML = q.get("title") || "";
document.getElementById("sub").textContent = q.get("sub") || "";
document.getElementById("foot").textContent = q.get("foot") || "github.com/vitormartins1/go-multiplayer-control-plane";
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
// entra em cascata, segura, e some junto nos últimos 0,5 s
function inOut(el, t0, t, dy) {
  const a = ease((t - t0) / 0.7) * (1 - ease((t - (DUR - 0.5)) / 0.5));
  el.style.opacity = a;
  el.style.transform = `translateY(${(1 - ease((t - t0) / 0.7)) * dy}px)`;
}
window.__seek = (t) => {
  inOut(document.getElementById("brand"), 0.0, t, -10);
  inOut(document.getElementById("kicker"), 0.15, t, 24);
  inOut(document.getElementById("title"), 0.3, t, 32);
  inOut(document.getElementById("sub"), 0.5, t, 24);
  inOut(document.getElementById("foot"), 0.6, t, 10);
  document.getElementById("g1").style.transform = `translate(${-200 + t * 30}px, ${-250 + t * 12}px)`;
  document.getElementById("g2").style.transform = `translate(${1250 - t * 25}px, ${450 - t * 10}px)`;
  document.getElementById("grid").style.transform = `translate(${-(t * 6) % 64}px, 0)`;
  document.getElementById("bar").style.width = `${clamp(t / DUR) * 100}%`;
};
window.__seek(0);
</script>
</body>
</html>
