name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs anteriores do mesmo ref (economiza minutos em pushes rápidos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go · build / vet / test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # módulo único (ADR-0001): uma versão pra tudo
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # unit tests (os de integração ficam atrás da tag `integration`, no job abaixo)
      - run: go test ./... -race -cover

  integration:
    name: Go · integração (testcontainers)
    runs-on: ubuntu-latest # tem Docker pré-instalado (testcontainers sobe Postgres/MinIO)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=integration ./... -count=1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # instala a versão fixada (mesma validada localmente) — determinístico
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...

  vulncheck:
    name: govulncheck (dependências com CVE)
    runs-on: ubuntu-latest
    # Report-only até o primeiro resultado ser visto: a VM da revisão não
    # alcança o vuln.go.dev, então o estado inicial das dependências nunca foi
    # checado. Depois do primeiro run verde (ou das correções), tirar o
    # continue-on-error para o job bloquear. Ver docs/PENDENCIAS-DO-DONO.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # só reporta vulnerabilidade em código que o projeto de fato chama
      - run: govulncheck ./...

  contract:
    name: contrato · buf breaking (proto vs main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico para comparar com a main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.50.0
      # Mudança incompatível no .proto (tipo/número de campo, RPC removido) quebra
      # o jogo em produção — só com decisão do dono e pacote v2. Ver
      # docs/contracts/CHANGELOG.md.
      - run: |
          for svc in session-service matchmaking-service; do
            buf breaking "services/$svc" --against ".git#ref=origin/main,subdir=services/$svc"
          done

  frontend:
    name: admin-ui · lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run lint # eslint: dependência faltando em hook é erro
      - run: npm test # vitest nos lib/ puros
      - run: npm run build # tsc --noEmit && vite build
