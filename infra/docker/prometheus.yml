global:
  scrape_interval: 15s

scrape_configs:
  - job_name: identity-service
    static_configs:
      - targets: ["identity-service:8080"]

  - job_name: achievements-service
    static_configs:
      - targets: ["achievements-service:8080"]

  # Workers do fan-out durável (ADR-0020): fanout_consume_total / duração.
  - job_name: achievements-consumer
    static_configs:
      - targets: ["achievements-consumer:8080"]

  - job_name: leaderboard-consumer
    static_configs:
      - targets: ["leaderboard-consumer:8080"]

  # analytics-service (ADR-0021): worker pool (analytics_events_*) + read API.
  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8080"]

  - job_name: analytics-postgres
    static_configs:
      - targets: ["analytics-postgres-exporter:9187"]

  - job_name: player-data-service
    static_configs:
      - targets: ["player-data-service:8080"]

  - job_name: cloud-save-service
    static_configs:
      - targets: ["cloud-save-service:8080"]

  - job_name: leaderboard-service
    static_configs:
      - targets: ["leaderboard-service:8080"]

  - job_name: matchmaking-service
    static_configs:
      - targets: ["matchmaking-service:8080"]

  - job_name: session-service
    static_configs:
      - targets: ["session-service:8080"]

  - job_name: game-registry
    static_configs:
      - targets: ["game-registry:8080"]

  - job_name: admin-bff
    static_configs:
      - targets: ["admin-bff:8080"]

  - job_name: identity-postgres
    static_configs:
      - targets: ["identity-postgres-exporter:9187"]

  - job_name: achievements-postgres
    static_configs:
      - targets: ["achievements-postgres-exporter:9187"]

  - job_name: game-registry-postgres
    static_configs:
      - targets: ["game-registry-postgres-exporter:9187"]

  - job_name: player-data-postgres
    static_configs:
      - targets: ["player-data-postgres-exporter:9187"]

  # MinIO expõe métricas Prometheus nativas (cloud-save storage).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pi 5 — federation: puxa métricas de hardware (node-exporter), k8s
  # (kube-state-metrics) e Agones do Prometheus que roda no cluster do Pi.
  # Docker Desktop no Mac não roteia containers → LAN diretamente; o túnel
  # tools/pi5/start-pi-prometheus-tunnel.sh expõe o Pi em host.docker.internal:39090.
  # Se o Pi/túnel estiver desligado, o Prometheus loga scrape error e segue normalmente.
  - job_name: pi5-federation
    honor_labels: true
    metrics_path: /federate
    params:
      match[]:
        - '{__name__=~"node_.+"}'
        - '{__name__=~"kube_.+"}'
        - '{__name__=~"agones_.+"}'
        - '{__name__=~"container_.+"}'
    static_configs:
      - targets: ["host.docker.internal:39090"]
        labels:
          cluster: pi5

  # k3d local — federation equivalente ao Pi 5 (infra/agones/k3d/install-monitoring.sh
  # instala o mesmo kube-prometheus-stack, sem Grafana). NodePort 32090 do
  # cluster mapeado pro host em 39091 (infra/agones/k3d/up.sh / k3d cluster
  # edit --port-add). Ambos os clusters têm Fleets com o MESMO nome
  # (packet-arena/capoeira-souls) — o label `cluster` abaixo é o que
  # diferencia nas queries dos dashboards (cluster="pi5" vs cluster="local"),
  # sem ele as duas fleets homônimas se somariam.
  - job_name: local-federation
    honor_labels: true
    metrics_path: /federate
    params:
      match[]:
        - '{__name__=~"node_.+"}'
        - '{__name__=~"kube_.+"}'
        - '{__name__=~"agones_.+"}'
        - '{__name__=~"container_.+"}'
    static_configs:
      - targets: ["host.docker.internal:39091"]
        labels:
          cluster: local
