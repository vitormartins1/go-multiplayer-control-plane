# Ambiente local do identity-service + observabilidade.
# Ver ADR-0006 e docs/OBSERVABILITY.md.
services:
  identity-service:
    build:
      context: ../..
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dev:dev@identity-postgres:5432/identity?sslmode=disable
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço (ADR-0018)
      GAME_REGISTRY_URL: http://game-registry:8080 # presença no login-into-game (ADR-0019)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
    depends_on:
      identity-postgres:
        condition: service_healthy
      game-registry:
        condition: service_started
      tempo:
        condition: service_started

  achievements-service:
    build:
      context: ../..
      dockerfile: services/achievements-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dev:dev@achievements-postgres:5432/achievements?sslmode=disable
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço (ADR-0018)
      IDENTITY_JWKS_URL: http://identity-service:8080/.well-known/jwks.json # valida o JWT (ADR-0009)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
    depends_on:
      achievements-postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      tempo:
        condition: service_started

  player-data-service:
    build:
      context: ../..
      dockerfile: services/player-data-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dev:dev@player-data-postgres:5432/player_data?sslmode=disable
      IDENTITY_JWKS_URL: http://identity-service:8080/.well-known/jwks.json # valida o JWT (ADR-0009)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço nos /admin (ADR-0018)
    depends_on:
      player-data-postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      tempo:
        condition: service_started

  cloud-save-service:
    build:
      context: ../..
      dockerfile: services/cloud-save-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: cloud-save
      IDENTITY_JWKS_URL: http://identity-service:8080/.well-known/jwks.json # valida o JWT (ADR-0009)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço nos /admin (ADR-0018)
    depends_on:
      minio:
        condition: service_started
      identity-service:
        condition: service_started
      tempo:
        condition: service_started

  leaderboard-service:
    build:
      context: ../..
      dockerfile: services/leaderboard-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      IDENTITY_JWKS_URL: http://identity-service:8080/.well-known/jwks.json # valida o JWT (ADR-0009)
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço nos /admin (ADR-0018)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
    depends_on:
      redis:
        condition: service_started
      identity-service:
        condition: service_started
      tempo:
        condition: service_started

  # Primeiro serviço gRPC (ADR-0003). Duas portas: gRPC + HTTP (métricas/health).
  matchmaking-service:
    build:
      context: ../..
      dockerfile: services/matchmaking-service/Dockerfile
    ports:
      - "8086:8080"   # HTTP: /metrics, /healthz
      - "50051:50051" # gRPC: FindMatch
    environment:
      PORT: "8080"
      GRPC_PORT: "50051"
      IDENTITY_JWKS_URL: http://identity-service:8080/.well-known/jwks.json # valida o JWT (ADR-0009)
      SESSION_GRPC_ADDR: session-service:50051 # provisiona a sessão ao formar o match (ADR-0010)
      GAME_REGISTRY_URL: http://game-registry:8080 # tamanho do match vem do perfil (ADR-0023)
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço p/ o game-registry (ADR-0018)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
    depends_on:
      identity-service:
        condition: service_started
      session-service:
        condition: service_started
      game-registry:
        condition: service_started
      tempo:
        condition: service_started

  # session-service: control plane interno (≈ GameLift). gRPC unary
  # (CreateSession, ReportResult) + HTTP para o JWKS do connect token (ADR-0010).
  session-service:
    build:
      context: ../..
      dockerfile: services/session-service/Dockerfile
    ports:
      - "8087:8080"   # HTTP: /.well-known/jwks.json, /metrics, /healthz
      - "50052:50051" # gRPC: CreateSession, ReportResult
    environment:
      PORT: "8080"
      GRPC_PORT: "50051"
      # Snapshot do perfil do modo no CreateSession (ADR-0024) — obrigatório
      # para QUALQUER sessão; sem isso o Create falha com profile unavailable.
      GAME_REGISTRY_URL: http://game-registry:8080
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço (ADR-0018)
      # Pool mock maior que o default (3): permite várias salas abertas ao
      # mesmo tempo no console em dev (cada sessão aberta segura um slot).
      SERVER_POOL: 10.0.0.1:7777,10.0.0.2:7777,10.0.0.3:7777,10.0.0.4:7777,10.0.0.5:7777,10.0.0.6:7777,10.0.0.7:7777,10.0.0.8:7777
      # Fan-out durável (ADR-0020): publica o resultado no tópico SNS match-results.
      MATCH_RESULTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:match-results
      AWS_ENDPOINT_URL: http://localstack:4566 # LocalStack (mesmo padrão MinIO/S3)
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
      # Chave Ed25519 persistente do connect token (PEM PKCS8). Sem ela o
      # serviço gera uma efêmera a cada boot e todo game server Ready fica
      # com JWKS velho — obriga a reciclar a fleet a cada restart do session.
      # Gerar uma vez: infra/docker/gen-secrets.sh
      JWT_PRIVATE_KEY_FILE: /run/secrets/session-jwt-key
    secrets:
      - session-jwt-key
    depends_on:
      messaging-provisioner:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  # Worker do fan-out durável (ADR-0020): consome match-results-achievements e
  # aplica match_played/match_won (idempotente por matchID). Mesmo image do
  # achievements-service, entrypoint no binário consumer.
  achievements-consumer:
    build:
      context: ../..
      dockerfile: services/achievements-service/Dockerfile
    entrypoint: ["/achievements-consumer"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dev:dev@achievements-postgres:5432/achievements?sslmode=disable
      MATCH_RESULTS_QUEUE_URL: http://localstack:4566/000000000000/match-results-achievements
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
    depends_on:
      achievements-postgres:
        condition: service_healthy
      messaging-provisioner:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  # Worker do fan-out durável (ADR-0020): consome match-results-leaderboard e
  # submete o score (idempotente via ZADD GT).
  leaderboard-consumer:
    build:
      context: ../..
      dockerfile: services/leaderboard-service/Dockerfile
    entrypoint: ["/leaderboard-consumer"]
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      MATCH_RESULTS_QUEUE_URL: http://localstack:4566/000000000000/match-results-leaderboard
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
    depends_on:
      redis:
        condition: service_started
      messaging-provisioner:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  # analytics-service (ADR-0021): consome o fan-out match-results por um worker
  # pool e agrega rollups por jogo; expõe a read API do overview p/ o painel.
  analytics-service:
    build:
      context: ../..
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "8091:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dev:dev@analytics-postgres:5432/analytics?sslmode=disable
      ANALYTICS_QUEUE_URL: http://localstack:4566/000000000000/match-results-analytics
      ANALYTICS_WORKERS: "4"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
    depends_on:
      analytics-postgres:
        condition: service_healthy
      messaging-provisioner:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  # admin-bff: back-end-for-frontend do painel admin (ADR-0016). Agregador
  # read-only — lê o Prometheus e a API admin do achievements. Sem banco.
  admin-bff:
    build:
      context: ../..
      dockerfile: services/admin-bff/Dockerfile
    ports:
      - "8088:8080" # HTTP: API, /metrics, /healthz
    environment:
      PORT: "8080"
      PROMETHEUS_URL: http://prometheus:9090
      ACHIEVEMENTS_URL: http://achievements-service:8080
      IDENTITY_URL: http://identity-service:8080
      GAME_REGISTRY_URL: http://game-registry:8080
      LEADERBOARD_URL: http://leaderboard-service:8080 # aba Leaderboards do painel (ADR-0016)
      PLAYER_DATA_URL: http://player-data-service:8080 # aba Player data do painel (ADR-0016)
      CLOUD_SAVE_URL: http://cloud-save-service:8080 # aba Cloud saves do painel (ADR-0016)
      SESSION_URL: http://session-service:8080 # aba Sessions do painel (spec 007)
      ANALYTICS_URL: http://analytics-service:8080 # aba Analytics do painel (ADR-0021)
      INTERNAL_API_KEY: dev-internal-key # injeta nos callers serviço-a-serviço (ADR-0018)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
    depends_on:
      prometheus:
        condition: service_started
      achievements-service:
        condition: service_started
      identity-service:
        condition: service_started
      game-registry:
        condition: service_started
      player-data-service:
        condition: service_started
      cloud-save-service:
        condition: service_started
      tempo:
        condition: service_started

  # admin-ui: front do painel admin (React+Vite). nginx serve o build estático e
  # faz proxy de /api -> admin-bff (mesma origem, sem CORS). Ver ADR-0016.
  admin-ui:
    build:
      context: ../../services/admin-ui
      dockerfile: Dockerfile
    ports:
      - "8089:80" # http://localhost:8089
    depends_on:
      admin-bff:
        condition: service_started

  # game-registry: fonte canônica de jogos (ADR-0017). Fornece o game_id
  # (multi-tenant). REST + Postgres próprio. Control plane interno.
  game-registry:
    build:
      context: ../..
      dockerfile: services/game-registry/Dockerfile
    ports:
      - "8090:8080" # HTTP: API, /metrics, /healthz
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dev:dev@game-registry-postgres:5432/game_registry?sslmode=disable
      INTERNAL_API_KEY: dev-internal-key # auth serviço-a-serviço (ADR-0018)
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317 # liga o tracing (ADR-0014)
    depends_on:
      game-registry-postgres:
        condition: service_healthy
      tempo:
        condition: service_started

  # Banco próprio do identity (database-per-service, ADR-0015).
  identity-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      # aplica a migration na inicialização do banco
      - ../../services/identity-service/migrations/001_create_accounts.sql:/docker-entrypoint-initdb.d/001_create_accounts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco próprio do achievements (database-per-service, ADR-0015).
  achievements-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: achievements
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - ../../services/achievements-service/migrations/001_create_achievements.sql:/docker-entrypoint-initdb.d/001_create_achievements.sql:ro
      - ../../services/achievements-service/migrations/002_add_progress.sql:/docker-entrypoint-initdb.d/002_add_progress.sql:ro
      - ../../services/achievements-service/migrations/003_add_game_scope.sql:/docker-entrypoint-initdb.d/003_add_game_scope.sql:ro
      - ../../services/achievements-service/migrations/004_processed_matches.sql:/docker-entrypoint-initdb.d/004_processed_matches.sql:ro
      - ../../services/achievements-service/migrations/005_stat_criteria.sql:/docker-entrypoint-initdb.d/005_stat_criteria.sql:ro
      - ../../services/achievements-service/migrations/006_processed_participations.sql:/docker-entrypoint-initdb.d/006_processed_participations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d achievements"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco próprio do player-data (database-per-service, ADR-0015).
  player-data-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: player_data
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5434:5432"
    volumes:
      - ../../services/player-data-service/migrations/001_create_player_data.sql:/docker-entrypoint-initdb.d/001_create_player_data.sql:ro
      - ../../services/player-data-service/migrations/002_add_game_scope.sql:/docker-entrypoint-initdb.d/002_add_game_scope.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d player_data"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco próprio do game-registry (database-per-service, ADR-0015).
  game-registry-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: game_registry
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5435:5432"
    volumes:
      - ../../services/game-registry/migrations/001_create_games.sql:/docker-entrypoint-initdb.d/001_create_games.sql:ro
      - ../../services/game-registry/migrations/002_seed_sandbox.sql:/docker-entrypoint-initdb.d/002_seed_sandbox.sql:ro
      - ../../services/game-registry/migrations/003_create_game_players.sql:/docker-entrypoint-initdb.d/003_create_game_players.sql:ro
      - ../../services/game-registry/migrations/004_add_cover_metadata.sql:/docker-entrypoint-initdb.d/004_add_cover_metadata.sql:ro
      - ../../services/game-registry/migrations/005_add_multiplayer_profile.sql:/docker-entrypoint-initdb.d/005_add_multiplayer_profile.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d game_registry"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage do cloud-save (S3-compatible; ADR-0015). Métricas Prometheus
  # nativas em /minio/v2/metrics/cluster (sem exporter separado).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public # métricas sem auth
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web

  # LocalStack: SNS/SQS locais do fan-out durável (ADR-0020), mesmo padrão do
  # MinIO p/ S3 — o código só troca o endpoint (AWS_ENDPOINT_URL) na prod.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sns,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics && awslocal sqs list-queues"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Provisiona o tópico/filas/DLQ via Terraform (ADR-0004/0020) assim que o
  # LocalStack sobe. Roda uma vez e sai; quem depende do messaging usa
  # `condition: service_completed_successfully`.
  messaging-provisioner:
    image: hashicorp/terraform:1.9
    working_dir: /tf
    entrypoint: ["/bin/sh", "-c", "terraform init -input=false && terraform apply -auto-approve -input=false"]
    volumes:
      - ../terraform/environments/local/messaging:/tf
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  # Ranking real-time do leaderboard (Redis sorted sets; ADR-0015).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage # retém/serve exemplars p/ o Grafana (ADR-0014)
      - --web.enable-remote-write-receiver # recebe métricas de trace do Tempo (service graph)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - identity-service

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200" # API de query
      - "4317:4317" # OTLP gRPC (ingestão)

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

  # Um exporter por banco — padrão a repetir a cada serviço novo (ver OBSERVABILITY.md).
  identity-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://dev:dev@identity-postgres:5432/identity?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - identity-postgres

  achievements-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://dev:dev@achievements-postgres:5432/achievements?sslmode=disable
    ports:
      - "9188:9187"
    depends_on:
      - achievements-postgres

  player-data-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://dev:dev@player-data-postgres:5432/player_data?sslmode=disable
    ports:
      - "9189:9187"
    depends_on:
      - player-data-postgres

  game-registry-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://dev:dev@game-registry-postgres:5432/game_registry?sslmode=disable
    ports:
      - "9190:9187"
    depends_on:
      - game-registry-postgres

  # Banco próprio do analytics (database-per-service, ADR-0015).
  analytics-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5436:5432"
    volumes:
      - ../../services/analytics-service/migrations/001_create_analytics.sql:/docker-entrypoint-initdb.d/001_create_analytics.sql:ro
      - ../../services/analytics-service/migrations/002_outcome_counts.sql:/docker-entrypoint-initdb.d/002_outcome_counts.sql:ro
      - ../../services/analytics-service/migrations/003_participation_rollup.sql:/docker-entrypoint-initdb.d/003_participation_rollup.sql:ro
      - ../../services/analytics-service/migrations/004_placement_rollup.sql:/docker-entrypoint-initdb.d/004_placement_rollup.sql:ro
      - ../../services/analytics-service/migrations/005_mission_rollup.sql:/docker-entrypoint-initdb.d/005_mission_rollup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://dev:dev@analytics-postgres:5432/analytics?sslmode=disable
    ports:
      - "9191:9187"
    depends_on:
      - analytics-postgres

# Segredos de dev (gitignored — infra/docker/secrets/). Gerar: gen-secrets.sh
secrets:
  session-jwt-key:
    file: ./secrets/session-jwt-ed25519.pem
