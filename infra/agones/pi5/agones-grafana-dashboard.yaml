apiVersion: v1
kind: ConfigMap
metadata:
  name: agones-fleet-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  agones-fleet.json: |
    {
      "title": "Agones Fleet",
      "uid": "agones-fleet-pi5",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "tags": ["agones", "gameservers"],
      "panels": [
        {
          "type": "stat",
          "title": "GameServers Ready",
          "id": 1,
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "red", "value": 0},
                {"color": "green", "value": 1}
              ]}
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "sum(agones_gameservers_count{type=\"Ready\"}) or vector(0)",
            "instant": true
          }]
        },
        {
          "type": "stat",
          "title": "GameServers Allocated",
          "id": 2,
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "blue", "value": 0}
              ]}
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "sum(agones_gameservers_count{type=\"Allocated\"}) or vector(0)",
            "instant": true
          }]
        },
        {
          "type": "stat",
          "title": "GameServers Unhealthy",
          "id": 3,
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": 0},
                {"color": "red", "value": 1}
              ]}
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "sum(agones_gameservers_count{type=\"Unhealthy\"}) or vector(0)",
            "instant": true
          }]
        },
        {
          "type": "stat",
          "title": "Fleet Desired / Ready",
          "id": 4,
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "options": {"colorMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value_and_name"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "text"}}},
          "targets": [
            {
              "datasource": {"type": "prometheus"},
              "expr": "sum(agones_fleets_replicas_count{type=\"desired\"}) or vector(0)",
              "legendFormat": "desired",
              "instant": true
            },
            {
              "datasource": {"type": "prometheus"},
              "expr": "sum(agones_fleets_replicas_count{type=\"ready\"}) or vector(0)",
              "legendFormat": "ready",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GameServer States",
          "id": 5,
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4},
          "options": {"tooltip": {"mode": "multi", "sort": "none"}},
          "fieldConfig": {
            "defaults": {
              "custom": {"fillOpacity": 10, "lineWidth": 2},
              "min": 0
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "sum by (type) (agones_gameservers_count)",
            "legendFormat": "{{type}}"
          }]
        },
        {
          "type": "gauge",
          "title": "Pi CPU %",
          "id": 6,
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 12},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": 0},
                {"color": "yellow", "value": 70},
                {"color": "red", "value": 90}
              ]}
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)",
            "instant": true
          }]
        },
        {
          "type": "gauge",
          "title": "Pi RAM %",
          "id": 7,
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 12},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": 0},
                {"color": "yellow", "value": 75},
                {"color": "red", "value": 90}
              ]}
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
            "instant": true
          }]
        },
        {
          "type": "gauge",
          "title": "Pi Temperatura (°C)",
          "id": 8,
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 12},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "max": 85,
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": 0},
                {"color": "yellow", "value": 60},
                {"color": "red", "value": 75}
              ]}
            }
          },
          "targets": [{
            "datasource": {"type": "prometheus"},
            "expr": "node_thermal_zone_temp{zone=\"0\"}",
            "instant": true
          }]
        }
      ]
    }
