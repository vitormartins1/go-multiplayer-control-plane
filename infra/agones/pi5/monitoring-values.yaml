# kube-prometheus-stack — homelab Pi 5 (spec 007)
# Grafana desligado: os dashboards vivem no Grafana do go-multiplayer-control-plane.
# O Prometheus do Pi fica exposto via NodePort 32090 para que o Prometheus
# do backend possa fazer federation e puxar todas as métricas do Pi.

grafana:
  enabled: false

prometheus:
  service:
    type: NodePort
    nodePort: 32090
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    additionalScrapeConfigs:
      # Descoberta por endpoints (cada pod vira um target): os Services de
      # métricas do Agones balanceiam entre as réplicas HA e SÓ O LÍDER
      # exporta as métricas de estado (agones_gameservers_count,
      # agones_fleets_replicas_count) — raspar pelo DNS do Service alterna
      # líder/standby a cada scrape e as séries somem por staleness.
      - job_name: agones
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [agones-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: agones-(controller|extensions|allocator)-metrics-service
            action: keep
          - source_labels: [__meta_kubernetes_service_name]
            regex: agones-(.+)-metrics-service
            target_label: job
            replacement: agones-$1
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

# Alertmanager desnecessário no homelab
alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
